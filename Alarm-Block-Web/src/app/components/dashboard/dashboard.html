<div class="dashboard">

    <h1 class="dashboard-title fw-normal mb-0">
        Hola, Camila
    </h1>

    <section class="row metrics-row g-0">

        <div class="col-auto metric-column">
            <div class="card metric-card">
                <div class="card-body">
                    <h2 class="metric-value fw-semibold mb-2">5</h2>
                    <p class="text-secondary mb-0">
                        Días sin posponer
                    </p>
                </div>
            </div>
        </div>

        <div class="col-auto metric-column">
            <div class="card metric-card">
                <div class="card-body">
                    <h2 class="metric-value fw-semibold mb-2">78%</h2>
                    <p class="text-secondary mb-0">
                        Cumplimiento del mes
                    </p>
                </div>
            </div>
        </div>

        <div class="col-auto metric-column">
            <div class="card metric-card">
                <div class="card-body">
                    <h2 class="metric-value fw-semibold mb-2">2</h2>
                    <p class="text-secondary mb-0">
                        Alarmas activas
                    </p>
                </div>
            </div>
        </div>

    </section>

    <!-- Administrar -->
    <section class="admin-section">

        <h2 class="admin-title fw-normal mb-2">
            Administrar
        </h2>

        <hr class="admin-divider mt-0 mb-0">

        <div class="row admin-row g-0">

            <!-- Preferencias -->
            <div class="col-auto admin-column">
                <div class="card admin-card">
                    <div class="card-body d-flex flex-column align-items-start">

                        <h3 class="admin-card-title fw-semibold mb-2">
                            Preferencias
                        </h3>

                        <p class="text-secondary mb-3">
                            Notificación y zona horaria
                        </p>

                        <button
                            type="button"
                            class="btn btn-outline-primary admin-button"
                        >
                            Ver más
                        </button>

                    </div>
                </div>
            </div>

            <!-- Alarmas recurrentes -->
            <div class="col-auto admin-column">
                <div class="card admin-card">
                    <div class="card-body d-flex flex-column align-items-start">

                        <h3 class="admin-card-title fw-semibold mb-2">
                            Alarmas Recurrentes
                        </h3>

                        <p class="text-secondary mb-3">
                            Ver, editar o crear nuevas alarmas
                        </p>

                        <button
                            type="button"
                            class="btn btn-outline-primary admin-button"
                            [routerLink]="['/recurring-alarms']"
                        >
                            Ver más
                        </button>

                    </div>
                </div>
            </div>

            <!-- Historial -->
            <div class="col-auto admin-column">
                <div class="card admin-card">
                    <div class="card-body d-flex flex-column align-items-start">

                        <h3 class="admin-card-title fw-semibold mb-2">
                            Historial
                        </h3>

                        <p class="text-secondary mb-3">
                            Cumplimiento por semana
                        </p>

                        <button
                            type="button"
                            class="btn btn-outline-primary admin-button"
                            routerLink="/history"
                        >
                            Ver más
                        </button>

                    </div>
                </div>
            </div>

        </div>

    </section>



</div>
