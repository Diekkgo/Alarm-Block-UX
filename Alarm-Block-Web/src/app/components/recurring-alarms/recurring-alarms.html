<div class="recurring-alarms-page">

    <!-- Volver -->
    <a
        [routerLink]="['/dashboard']"
        class="back-link d-inline-flex align-items-center text-decoration-none"
    >
        <span class="back-icon">‹</span>
        <span>Dashboard</span>
    </a>

    <!-- Título -->
    <h1 class="page-title fw-normal mb-0">
        Mis Alarmas Recurrentes
    </h1>

    <!-- Alarmas -->
    <section class="alarms-list">

        <!-- Alarma 1 -->
        <article class="card alarm-card">
            <div class="card-body d-flex align-items-center justify-content-between">

                <div>
                    <h2 class="alarm-title fw-normal mb-3">
                        6:30 AM - Trabajo
                    </h2>

                    <p class="alarm-description mb-0">
                        L M X J V - Misión: Operación matemática - Límite: 3 veces
                    </p>
                </div>

                <div class="d-flex align-items-center alarm-actions">

                    <div class="form-check form-switch m-0">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            role="switch"
                            id="workAlarm"
                            checked
                        >
                    </div>

                    <button
                        type="button"
                        class="btn edit-button p-0 border-0"
                        aria-label="Editar alarma Trabajo"
                    >
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>

                </div>

            </div>
        </article>

        <!-- Alarma 2 -->
        <article class="card alarm-card">
            <div class="card-body d-flex align-items-center justify-content-between">

                <div>
                    <h2 class="alarm-title fw-normal mb-3">
                        7:00 AM - Gimnasio
                    </h2>

                    <p class="alarm-description mb-0">
                        L M V - Misión: Agitar el celular - Límite: 2 veces
                    </p>
                </div>

                <div class="d-flex align-items-center alarm-actions">

                    <div class="form-check form-switch m-0">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            role="switch"
                            id="gymAlarm"
                            checked
                        >
                    </div>

                    <button
                        type="button"
                        class="btn edit-button p-0 border-0"
                        aria-label="Editar alarma Gimnasio"
                    >
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>

                </div>

            </div>
        </article>

    </section>

    <button
        type="button"
        class="btn new-alarm-button fw-semibold"
    >
        Nueva Alarma Recurrente
    </button>

</div>
